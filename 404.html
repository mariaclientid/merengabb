<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 — Merenga</title>
<style>:root{--cream:#FBF8EC;--yellow:#F3EA9E;--ink:#17160F}*{margin:0;box-sizing:border-box}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;background:var(--yellow);color:var(--ink);font-family:'Helvetica Neue',Arial,sans-serif;text-align:center;padding:2rem}
h1{font-size:clamp(3rem,12vw,7rem);font-weight:800;letter-spacing:-.02em}p{color:#3a392f}
a{color:var(--ink);font-weight:600;text-transform:uppercase;letter-spacing:.1em;font-size:.82rem;border-bottom:1px solid var(--ink);padding-bottom:3px;text-decoration:none}</style></head>
<body><h1>404</h1><p>Page not found.</p><a id="home" href="./">← Back to Merenga</a>
<script>var p=location.pathname.split('/');document.getElementById('home').href=(p.length>2?'/'+p[1]+'/':'/');</script></body></html>
